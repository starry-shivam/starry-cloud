[package]
name = "starry-cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
minijinja = { version = "2.24", default-features = false, features = ["builtins", "multi_template", "serde"] }
openidconnect = { version = "4.0", default-features = false, features = ["reqwest"] }
pbkdf2 = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rpassword = "7"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true