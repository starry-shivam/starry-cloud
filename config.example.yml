title: "Starry Cloud ✨"
subtitle: "A cozy home for my self-hosted apps"

# Number of proxy layers in front of this app that should be trusted for
# forwarded client IP/protocol headers. Use 0 when running directly, 1 when
# behind one reverse proxy (for example, Nginx/Caddy/Traefik/Cloudflare),
# and increase only if you intentionally chain multiple trusted proxies.
trusted_proxy_hops: 0

bot_protection:
  # Block common crawler user-agent signatures on login and protected routes.
  block_known_crawlers: true

  # Additional user-agent substrings to block.
  blocked_user_agents: []

  # Login throttling controls.
  login_max_attempts: 3
  login_window_seconds: 300
  login_lockout_seconds: 900

# Optional override for the "Local" button's host when using `lan_port`
# below. Auto-detected by default; set this if auto-detection picks the
# wrong address (common when running in Docker without host networking).
# lan_host: "192.168.1.100"

# Available services to show on the dashboard. Order matters.
# Add `web_url` to show a public "Web" button. For LAN-only services, omit it
# and add `lan_port` (just a port number); the app builds a "Local" button at
# `http://<lan_host>:<port>` using the device's local IP (see `lan_host` above).
services:
  - name: "Service One"
    web_url: "https://service-one.example.com"
    emoji: "🌐"
    description: "Replace with your first service"

  - name: "Service Two"
    web_url: "https://service-two.example.com"
    emoji: "🧩"
    description: "Replace with your second service"

  - name: "Local Service"
    lan_port: 8080
    emoji: "🏠"
    description: "Example local/LAN service"

  - name: "Dual Access Service"
    web_url: "https://dual.example.com"
    lan_port: 9090
    emoji: "🔀"
    description: "Example service reachable via both domain and LAN"
